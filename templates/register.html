<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Register</title>
    <!-- Use Inter font or system fonts for consistency -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='register.css') }}">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Branding Logo -->
            <div class="logo">🚀</div>

            <!-- Header Information -->
            <h1>Get Started</h1>
            <p class="welcome">Create a new account</p>
            <p class="subtitle">Enter your details to register and start exploring.</p>

            <!-- Registration Form -->
            <form id="registerForm">
                
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required autocomplete="name">
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-box">
                        <input type="password" id="password" placeholder="Create a password" required autocomplete="new-password">
                        <button type="button" id="togglePassword" class="eye-btn" aria-label="Toggle password visibility">🙈</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-box">
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
                        <button type="button" id="toggleConfirmPassword" class="eye-btn" aria-label="Toggle confirm password visibility">🙈</button>
                    </div>
                </div>

                <button type="submit" class="register-btn">Create Account</button>

                <!-- Feedback Message Container -->
                <p id="message"></p>

            </form>

            <!-- Footer / Navigation Divider -->
            <div class="divider">or</div>

            <div class="signup">
                Already have an account? 
                <a href="/">Login</a>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', path='register.js') }}"></script>

</body>
</html>
