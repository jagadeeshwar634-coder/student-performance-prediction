<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentAI — Secure Login</title>
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="{{ url_for('static', path='login.css') }}">
</head>
<body class="login-body">

    <main class="login-wrapper">
        <section class="login-card" aria-labelledby="login-title">
            
            <!-- Brand Header -->
            <div class="login-header">
                <span class="logo" role="img" aria-label="Graduation Cap">🎓</span>
                <h1 id="login-title">StudentAI</h1>
                <p class="welcome">Welcome Back 👋</p>
                <p class="subtitle">Log in to access your student performance dashboard</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <div class="input-group">
    <label for="email">Email Address</label>

    <input 
       
    type="email" 
    id="email" 
    name="email"
    placeholder="name@student.edu"
    autocomplete="off"
    required
>
    
</div>

<div class="input-group">
    <label for="password">Password</label>

    <div class="password-box">

        <input 
            type="password" 
            id="password" 
            name="password"
            placeholder="Enter your password"
            autocomplete="off"
            required
        >

        <button 
            type="button" 
            id="togglePassword" 
            class="eye-btn"
            aria-label="Show password"
        >
            👁️
        </button>

    </div>
</div>

                <div class="login-options">
                    <label class="remember" for="remember">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="/forgot-password" class="forgot">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <span>Login</span>
                </button>

                <!-- Dynamic feedback message container -->
                <div id="message" role="alert" aria-live="polite"></div>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <footer class="login-footer">
                <p class="signup">
                    Don't have an account? 
                    <a href="/register">Create Account</a>
                </p>
            </footer>

        </section>
    </main>

    <script src="{{ url_for('static', path='login.js') }}" defer></script>
</body>
</html>
